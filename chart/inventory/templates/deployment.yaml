apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      # Meets the "restricted" pod security level, the Kubernetes equivalent of OpenShift's restricted SCC
      securityContext:
        runAsNonRoot: true
        {{- with .Values.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inventory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /inventory/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /inventory/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # The only writable places: Tomcat's logs, temp and work directories
          volumeMounts:
            - { name: logs, mountPath: /usr/local/tomcat/logs }
            - { name: temp, mountPath: /usr/local/tomcat/temp }
            - { name: work, mountPath: /usr/local/tomcat/work }
      volumes:
        - { name: logs, emptyDir: {} }
        - { name: temp, emptyDir: {} }
        - { name: work, emptyDir: {} }
