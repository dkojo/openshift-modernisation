# Argo CD watches this repo and keeps the cluster matching the chart plus gitops/values-kind.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dkojo/openshift-modernisation.git
    targetRevision: REVISION   # CI pins this to the exact commit it just pushed
    path: chart/inventory
    helm:
      releaseName: inventory
      valueFiles:
        - values.yaml
        - ../../gitops/values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: legacy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true   # undo any manual change made in the cluster
